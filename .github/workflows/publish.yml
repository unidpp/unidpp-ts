name: publish
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - name: Publish the workspaces whose versions are new
        run: |
          for ws in packages/model packages/resolver packages/client packages/verify; do
            name=$(node -p "require('./$ws/package.json').name")
            version=$(node -p "require('./$ws/package.json').version")
            encoded=${name//\//%2f}
            if curl -sf "https://registry.npmjs.org/$encoded" | node -e "let d='';process.stdin.on('data',(c)=>d+=c).on('end',()=>{const vs=Object.keys(JSON.parse(d).versions||{});process.exit(vs.includes(process.argv[1])?0:1)})" "$version"; then
              echo "skip $name@$version (already published)"
            else
              npm publish "$ws" --access public --provenance
            fi
          done
