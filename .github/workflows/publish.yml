name: publish
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - name: Publish the workspaces whose versions are new
        run: |
          for ws in $(npm query .workspace --json | node -e 'let d="";process.stdin.on("data",(c)=>d+=c).on("end",()=>{for (const w of JSON.parse(d)) console.log(w.location)})'); do
            name=$(node -p "require('./$ws/package.json').name")
            version=$(node -p "require('./$ws/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "skip $name@$version (already published)"
            else
              npm publish "$ws" --access public --provenance
            fi
          done
